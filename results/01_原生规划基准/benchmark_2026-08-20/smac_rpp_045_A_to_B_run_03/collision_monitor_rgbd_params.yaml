collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel
    cmd_vel_out_topic: /cmd_vel_safe
    transform_tolerance: 0.3
    # The safety layer must reject stale observations instead of using them
    # as if they described the robot's current pose.
    source_timeout: 0.5
    base_shift_correction: true
    stop_pub_timeout: 1.0
    polygons: [PolygonStop, PolygonSlow]
    PolygonStop:
      type: polygon
      # Keep the hard stop close to the footprint. A larger zone can stop a
      # valid in-place turn at an obstacle corner before DWB can steer away.
      points: [0.38, 0.29, 0.38, -0.29, 0.10, -0.26, 0.10, 0.26]
      action_type: stop
      max_points: 4
      visualize: true
      polygon_pub_topic: polygon_stop
      enabled: true
    PolygonSlow:
      type: polygon
      points: [1.05, 0.32, 1.05, -0.32, 0.05, -0.29, 0.05, 0.29]
      action_type: slowdown
      slowdown_ratio: 0.65
      max_points: 4
      visualize: true
      polygon_pub_topic: polygon_slow
      enabled: true
    observation_sources: [obstacles]
    obstacles:
      type: pointcloud
      # Use the low-latency, decimated cloud from point_cloud_xyz. The raw
      # /camera/points stream is too large for a 20 Hz safety loop, while the
      # heavier /camera/obstacles cloud is reserved for costmap processing.
      topic: /camera/cloud
      min_height: 0.08
      max_height: 1.5
      enabled: true
