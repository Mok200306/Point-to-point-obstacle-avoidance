collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel
    cmd_vel_out_topic: /cmd_vel_safe
    transform_tolerance: 0.3
    source_timeout: 0.5
    base_shift_correction: true
    stop_pub_timeout: 1.0
    polygons:
    - PolygonStop
    - PolygonSlow
    PolygonStop:
      type: polygon
      points:
      - 0.38
      - 0.29
      - 0.38
      - -0.29
      - 0.1
      - -0.26
      - 0.1
      - 0.26
      action_type: stop
      max_points: 4
      visualize: true
      polygon_pub_topic: polygon_stop
      enabled: true
    PolygonSlow:
      type: polygon
      points:
      - 1.05
      - 0.32
      - 1.05
      - -0.32
      - 0.05
      - -0.29
      - 0.05
      - 0.29
      action_type: slowdown
      slowdown_ratio: 0.75
      max_points: 4
      visualize: true
      polygon_pub_topic: polygon_slow
      enabled: true
    observation_sources:
    - obstacles
    obstacles:
      type: pointcloud
      topic: /camera/cloud
      min_height: 0.08
      max_height: 1.5
      enabled: true
